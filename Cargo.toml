[package]
name = "jake"
version = "0.1.0"
edition = "2024"

[dependencies]
dotenvy = "0.15.7"
futures = "0.3.32"
html-escape = "0.2.14"
poise = "0.6.2"
reqwest = { version = "0.13.4", features = ["json", "query"] }
regex = "1"
url = "2"
scraper = "0.27.0"
serde = "1.0.228"
serde_json = "1.0.150"
serenity = "0.12"
sqlx = { version = "0.9.0", features = ["postgres", "runtime-tokio", "tls-native-tls", "json"] }
tokio = { version = "1.21.2", features = ["macros", "rt-multi-thread", "time", "sync", "process", "fs"] }

[profile.release]
# Smaller binary on the Pi; panics must keep unwinding because the hand-written
# scrapers rely on a panicking task failing only its own company.
strip = true
